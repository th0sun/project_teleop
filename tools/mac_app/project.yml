name: ProjectTeleopMac
options:
  bundleIdPrefix: dev.thesun.projectteleop
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  ProjectTeleopMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/ProjectTeleopMac
    info:
      path: Sources/ProjectTeleopMac/Info.plist
      properties:
        CFBundleName: ProjectTeleopMac
        CFBundleDisplayName: Project Teleop
        CFBundleShortVersionString: "0.1.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Project Teleop"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.thesun.projectteleop.mac
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
